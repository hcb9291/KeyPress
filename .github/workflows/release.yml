name: Release

# 推送 v* 标签时：自检 -> 打包单文件 exe -> 传到 GitHub Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: 打包并发布 exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 项目自检
        run: python tools/selfcheck.py

      - name: 安装 PyInstaller
        run: python -m pip install --disable-pip-version-check --upgrade pyinstaller

      - name: 打包
        shell: pwsh
        run: |
          # Tcl/Tk 要整个塞进包里，否则 exe 起来之后界面出不来
          $tcl = (python -c "import sys,os;print(os.path.join(sys.base_prefix,'tcl'))").Trim()
          $args = @(
            '--noconfirm', '--clean', '--onefile', '--windowed', '--name', 'KeyPresser',
            '--icon', 'assets\icon.ico',
            '--add-data', 'assets;assets',
            '--add-data', 'sounds;sounds',
            '--add-data', 'themes.json;.',
            '--add-data', 'tts_synth.ps1;.'
          )
          if (Test-Path $tcl) {
            Write-Host "打包 Tcl/Tk: $tcl"
            $args += @('--add-data', "$tcl;tcl")
          } else {
            Write-Warning "没有找到 Tcl/Tk 目录，改用 PyInstaller 默认方式"
          }
          python -m PyInstaller @args main.py

      - name: 校验产物
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\KeyPresser.exe')) {
            throw '打包失败：没有生成 dist\KeyPresser.exe'
          }
          Get-Item dist\KeyPresser.exe | Select-Object Name, Length

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KeyPresser.exe
          generate_release_notes: true
