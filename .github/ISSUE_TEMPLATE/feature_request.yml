name: 功能建议
description: 希望 KeyPresser 多一个功能，或者改掉哪里
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说说**你想解决什么问题、在什么场景下用**，
        而不只是"加一个按钮"——场景说清楚了，方案我们可以一起想。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 现在的做法哪里不顺手？
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法（可选）
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在是怎么绕过去的（可选）
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有的 Issue 和 README，没有重复的建议
          required: true
