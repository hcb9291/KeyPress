name: Bug 反馈
description: 程序没有按预期工作
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！填得越具体，定位越快。
        提之前可以先扫一眼 README 里的「常见问题」，有些现象是设计如此。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 用 exe 的话看窗口标题上的版本号；源码运行的话填 `python main.py --version` 的输出
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: how
    attributes:
      label: 你是怎么运行的
      options:
        - 下载的 exe
        - 源码运行（python main.py）
        - 自己打包的 exe
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: 例如 Windows 11 23H2
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步一步写，从打开程序开始
      placeholder: |
        1. 添加按键 A，间隔 100 毫秒
        2. 按 F8
        3. ……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其它信息（截图、提示文字等）
      description: 界面问题请尽量附截图；有报错弹窗请把文字复制过来
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有的 Issue，没有重复
          required: true
        - label: 我看过 README 的「常见问题」和「已知限制」
          required: true
